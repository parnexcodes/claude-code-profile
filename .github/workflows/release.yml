name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          targets=(
            "linux   amd64"
            "linux   arm64"
            "darwin  amd64"
            "darwin  arm64"
            "windows amd64"
          )
          mkdir -p bin
          for target in "${targets[@]}"; do
            read -r os arch <<< "$target"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            echo "building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION#v}" \
              -o "bin/ccp_${VERSION}_${os}_${arch}${ext}" .
          done

      - name: Package archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg_root="${RUNNER_TEMP}/pkg"
          mkdir -p dist
          cd bin
          for f in ccp_*; do
            plat="${f#"ccp_${VERSION}_"}"
            exe="ccp"
            case "$plat" in
              *.exe) exe="ccp.exe"; plat="${plat%.exe}" ;;
            esac
            stage="${pkg_root}/${plat}"
            mkdir -p "$stage"
            cp "$f" "${stage}/${exe}"
            cp ../README.md "$stage/"
            if [ -f ../LICENSE ]; then cp ../LICENSE "$stage/"; fi
            case "$plat" in
              windows*)
                (cd "$pkg_root" && zip -q -r "$GITHUB_WORKSPACE/dist/ccp_${VERSION}_${plat}.zip" "$plat")
                ;;
              *)
                tar -czf "$GITHUB_WORKSPACE/dist/ccp_${VERSION}_${plat}.tar.gz" -C "$pkg_root" "$plat"
                ;;
            esac
            rm -rf "$stage"
          done
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum ccp_* > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
